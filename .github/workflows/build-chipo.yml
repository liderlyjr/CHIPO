name: Build CHIPO firmware

on:
  workflow_dispatch:
    inputs:
      xiaozhi_ref:
        description: "XiaoZhi branch, tag or commit to build on (empty = the pinned commit)"
        required: false
        default: ""
  push:
    branches: [main]
    paths:
      - "components/**"
      - "integration/**"
      - "scripts/**"
      - "tests/**"
      - "docs/**"
      - "README.md"
      - "VERSION"
      - "XIAOZHI_REF"
      - ".github/workflows/build-chipo.yml"
  pull_request:
    branches: [main]
    paths:
      - "components/**"
      - "integration/**"
      - "scripts/**"
      - "tests/**"
      - "docs/**"
      - "README.md"
      - "VERSION"
      - "XIAOZHI_REF"
      - ".github/workflows/build-chipo.yml"

permissions:
  contents: read

concurrency:
  group: build-chipo-${{ github.ref }}
  cancel-in-progress: true

jobs:
  host-tests:
    name: Face and tilt tests (on a PC)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout CHIPO
        uses: actions/checkout@v4

      - name: Get LVGL (same 9.5 series XiaoZhi uses)
        run: git clone --depth 1 --branch v9.5.0 https://github.com/lvgl/lvgl.git "$RUNNER_TEMP/lvgl"

      - name: Tools for the Home Assistant provisioning test
        run: python3 -m pip install --break-system-packages esp-idf-nvs-partition-gen || echo "not installed - the image test will be skipped"

      - name: Run tests (AddressSanitizer + UBSan)
        run: LVGL_DIR="$RUNNER_TEMP/lvgl" tests/host/run.sh

  build:
    name: Compile CHIPO for Waveshare ESP32-S3 Touch AMOLED 2.16 (480x480)
    needs: host-tests
    runs-on: ubuntu-latest
    timeout-minutes: 90
    container:
      image: espressif/idf:v6.1
    steps:
      - name: Checkout CHIPO
        uses: actions/checkout@v4

      - name: Get XiaoZhi firmware base
        env:
          INPUT_REF: ${{ github.event.inputs.xiaozhi_ref }}
        run: |
          # Pinned XiaoZhi commit (file XIAOZHI_REF): every build, and every Release CHIPO installs by itself, uses
          # the exact base the CHIPO patches were checked against. To move to a newer XiaoZhi: run this workflow by
          # hand with xiaozhi_ref (a branch, tag or commit), check it, then change XIAOZHI_REF.
          REF="${INPUT_REF:-$(head -n1 XIAOZHI_REF | tr -d '[:space:]')}"
          test -n "$REF"
          git init -q build/xiaozhi-esp32
          git -C build/xiaozhi-esp32 remote add origin https://github.com/78/xiaozhi-esp32.git
          git -C build/xiaozhi-esp32 fetch -q --depth 1 origin "$REF"
          git -C build/xiaozhi-esp32 checkout -q FETCH_HEAD

      - name: Record exact versions used
        run: |
          {
            echo "CHIPO_COMMIT=$GITHUB_SHA"
            echo "CHIPO_VERSION=$(grep '^CHIPO_OS_VERSION=' VERSION | cut -d= -f2)"
            echo "XIAOZHI_COMMIT=$(git -C build/xiaozhi-esp32 rev-parse HEAD)"
          } | tee build/BUILD_INFO.txt

      - name: Apply CHIPO integration
        run: python scripts/integrate_chipo.py "$GITHUB_WORKSPACE" "$GITHUB_WORKSPACE/build/xiaozhi-esp32"

      - name: Show ESP-IDF version
        run: |
          . "$IDF_PATH/export.sh"
          idf.py --version

      - name: Compile for Waveshare ESP32-S3 AMOLED 2.16
        working-directory: build/xiaozhi-esp32
        run: |
          . "$IDF_PATH/export.sh"
          idf.py set-target esp32s3
          idf.py build

      # Resolve the addresses from the 2026-11-26 CHIPO boot panic in CI; no ELF download is needed.
      - name: Resolve previous CHIPO panic addresses
        if: success()
        working-directory: build/xiaozhi-esp32
        run: |
          . "$IDF_PATH/export.sh"
          xtensa-esp32s3-elf-addr2line -pfiaC -e build/xiaozhi.elf 0x420f870d 0x420fd972 0x420fdc6c 0x42106d8a 0x420fc8c3 0x420fc93f 0x420f4595 0x420efc66 0x420f3ac5 0x420fde6c 0x420e65c9

      - name: Upload firmware files
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: CHIPO-OS-Waveshare-ESP32-S3-AMOLED-2.16
          path: |
            build/xiaozhi-esp32/build/bootloader/bootloader.bin
            build/xiaozhi-esp32/build/partition_table/partition-table.bin
            build/xiaozhi-esp32/build/ota_data_initial.bin
            build/xiaozhi-esp32/build/xiaozhi.bin
            build/xiaozhi-esp32/build/xiaozhi.elf
            build/xiaozhi-esp32/build/generated_assets.bin
            build/xiaozhi-esp32/build/flash_args
            build/xiaozhi-esp32/build/flasher_args.json
            build/xiaozhi-esp32/build/flash_project_args
            build/BUILD_INFO.txt
          if-no-files-found: error
          compression-level: 6

  release:
    name: Publish GitHub Release for the 2.16 (CHIPO updates itself from it)
    needs: build
    # Only a merge to main publishes. Bumping CHIPO_OS_VERSION in VERSION is what creates a new Release.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Checkout CHIPO
        uses: actions/checkout@v4

      - name: Download the firmware built above
        uses: actions/download-artifact@v4
        with:
          name: CHIPO-OS-Waveshare-ESP32-S3-AMOLED-2.16
          path: dist

      - name: Create the Release if this version has none yet
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION="$(sed -n 's/^CHIPO_OS_VERSION=//p' VERSION | tr -d '\r')"
          echo "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$' || { echo "Bad version: $VERSION"; exit 1; }
          TAG="v$VERSION"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists: nothing to publish (bump VERSION for a new one)."
            exit 0
          fi
          cd dist
          BIN="$(find . -name xiaozhi.bin | head -n1)"
          test -n "$BIN" || { echo "xiaozhi.bin missing from the artifact"; exit 1; }
          # The asset name the device downloads, read from the firmware's own setting so they can never differ.
          ASSET="$(sed -n 's/^#define CHIPO_UPDATE_ASSET "\([^"]*\)".*/\1/p' ../components/chipo_update/include/chipo_update_config.h)"
          test -n "$ASSET" || { echo "CHIPO_UPDATE_ASSET not found"; exit 1; }
          cp "$BIN" "$ASSET"
          FILES=("$ASSET")
          for f in bootloader.bin partition-table.bin ota_data_initial.bin generated_assets.bin; do
            p="$(find . -name "$f" | head -n1)"
            [ -n "$p" ] && FILES+=("$p")
          done
          # Publish as the stable latest release only after host tests and firmware build succeeded.
          # This job depends on build, which depends on host-tests; any failure blocks publication.
          gh release create "$TAG" "${FILES[@]}" \
            --latest \
            --target "$GITHUB_SHA" \
            --title "CHIPO OS $VERSION" \
            --notes "Firmware CHIPO OS $VERSION for the Waveshare ESP32-S3 Touch AMOLED 2.16 (480x480). CHIPO installs this automatically through OTA (see docs/CHIPO_UPDATE.md). First flash on a new board: use all the files, as in the README. Published automatically only after all CI tests and firmware compilation pass."
